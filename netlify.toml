[build]
  command = "node build.js"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Il dominio senza www porta sempre a quello con www.
[[redirects]]
  from = "https://laterrazzadimarsala.it/*"
  to = "https://www.laterrazzadimarsala.it/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
